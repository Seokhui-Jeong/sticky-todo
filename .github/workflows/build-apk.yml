name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너 이미지에 안드로이드 SDK 가 이미 들어있으므로 setup-android 액션은 쓰지 않는다
      - name: Show environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-(unset)}"
          ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null || echo "no platforms dir"
          java -version
          echo "--- repo root ---"
          ls -1
          echo "--- workflows ---"
          ls -1 .github/workflows

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 이 저장소에는 gradlew(래퍼)가 없다. 래퍼 jar 는 바이너리라 함께 넣을 수 없다.
      # setup-gradle 이 깔아준 gradle 명령을 그대로 쓰면 래퍼가 필요 없다.
      # 혹시 나중에 래퍼를 커밋하더라도 그대로 동작하도록 양쪽을 모두 처리한다.
      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            echo "gradlew 발견 → 래퍼로 빌드"
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew 없음 → setup-gradle 의 gradle 로 빌드"
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
