name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너 이미지에 안드로이드 SDK 가 이미 들어있다.
      # 별도 setup-android 액션은 쓰지 않는다 (obsolete 'tools' 패키지 때문에 자주 실패한다)
      - name: Show environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-(unset)}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-(unset)}"
          ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null || echo "no platforms dir"
          ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" 2>/dev/null || echo "no build-tools dir"
          java -version
          echo "--- repo root ---"
          ls -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 빌드가 깨졌을 때 원인을 그대로 받아볼 수 있게 남긴다
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
