name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Releases 에 APK 를 올리려면 쓰기 권한이 필요하다
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 러너 이미지에 안드로이드 SDK 가 이미 들어있으므로 setup-android 액션은 쓰지 않는다
      - name: Show environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-(unset)}"
          ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null || echo "no platforms dir"
          java -version
          echo "--- repo root ---"
          ls -1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 이 저장소의 gradlew 는 래퍼 jar 없이 도는 셸 스크립트다.
      # gradle 이 이미 깔려 있으면 그쪽으로 넘어간다.
      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 폰에서 바로 받을 수 있게 Releases 에 올린다.
      # 항상 같은 이름(todo-widget.apk)으로 올리므로 아래 주소가 늘 최신 APK 를 가리킨다.
      #   https://github.com/<계정>/<저장소>/releases/latest/download/todo-widget.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk todo-widget.apk
          TAG="build-${{ github.run_number }}"
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          gh release create "$TAG" todo-widget.apk \
            --title "할 일 위젯 ($NOW)" \
            --notes "빌드 #${{ github.run_number }} · 아래 todo-widget.apk 를 눌러 바로 설치하세요." \
            --latest

      # 압축된 형태로도 남겨둔다 (PC 에서 받을 때용)
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-widget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
